name: StrukLokal QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all application and test modules
        run: >-
          python -m compileall -q app.py parser.py receipt_ocr.py
          prepare_models.py tests scripts

      - name: Run parser unit tests with warnings treated as errors
        run: python -W error -m unittest discover -s tests -v

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint Python sources
        run: ruff check --output-format=github .

      - name: Enforce Python formatting
        run: ruff format --check .

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject tracked caches, environments, and secret files
        run: python scripts/check_repo_hygiene.py

  required:
    name: Required QA gate
    if: always()
    needs: [test, lint, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every QA job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$LINT_RESULT" != "success" ] || [ "$HYGIENE_RESULT" != "success" ]; then
            echo "QA failed: test=$TEST_RESULT lint=$LINT_RESULT hygiene=$HYGIENE_RESULT"
            exit 1
          fi
          echo "All QA jobs passed."
